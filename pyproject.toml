[project]
name = "punt-biff"
version = "1.24.2"
description = "The dog that barked when messages arrived. A modern CLI communication tool for software engineers."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Punt Labs" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # Channel mode reaches FastMCP's _mcp_server (DES-087): pin the minor version.
    "fastmcp>=4.2.0,<4.3",
    "mcp>=2.3.0,<3",
    "pydantic>=2.0.0,<3",
    "typer>=0.15.0,<1",
    "nats-py[nkeys]>=2.13.1,<3",
    "pyyaml>=6.0,<7",
    "psutil>=6.0,<8",
    "punt-observe==0.1.1",
    "wcwidth>=0.8.2,<1",
    "watchdog>=7,<8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.13.0",
    "mypy>=1.18.1",
    "pyright>=1.1.400",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.1",
    "claude-agent-sdk>=0.1.36",
    "types-PyYAML>=6.0",
    "types-psutil>=6.0",
]

[dependency-groups]
dev = [
    "punt-oo-ratchet==0.5.0",
    "pydoclint==0.12.0",
    "docstring-parser-fork==0.0.16",
    "markdown==3.11.3",
    "types-markdown>=3.10,<4",
]
docs = ["mkdocs>=1.6.1", "mkdocstrings[python]>=1.0.8"]

[project.scripts]
biff = "biff.__main__:app"
biff-hook = "biff.plugins.claude_code._hook_runtime:main"

[project.urls]
Homepage = "https://github.com/punt-labs/biff"
Repository = "https://github.com/punt-labs/biff"
"Bug Tracker" = "https://github.com/punt-labs/biff/issues"

[build-system]
requires = ["uv_build>=0.9.14,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "biff"

[tool.ruff]
line-length = 88
target-version = "py313"
# .claude/rules/*.md carry fenced Python examples (some intentionally
# non-conforming); ruff must not try to parse them as source.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit (security)
    "BLE",  # flake8-blind-except
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "A",    # flake8-builtins
    "ERA",  # flake8-eradicate (commented code)
    "PIE",  # flake8-pie
    "RSE",  # flake8-raise
    "ARG",  # flake8-unused-arguments
    "RET",  # flake8-return
    "PERF", # perflint
    "PTH",  # flake8-use-pathlib
    "ISC",  # flake8-implicit-str-concat
    "FBT",  # flake8-boolean-trap
    "C90",  # mccabe complexity
]
extend-select = ["PLC0415"]

ignore = [
    "TC001",  # Move import into TYPE_CHECKING - too aggressive
    "TC003",  # Move standard lib import into TYPE_CHECKING
]

[tool.ruff.lint.per-file-ignores]
"tools/check_python_docs.py" = ["T20", "S603", "S607"]
"tests/test_python_docs.py" = ["S603"]
"tests/*" = ["S101", "S105", "S106", "S108", "T20", "SLF001", "ARG", "FBT", "PLC0415", "A002"]
"src/biff/__main__.py" = ["T20", "FBT", "PLC0415"]
"src/biff/cli_session.py" = ["T20"]
"src/biff/installer.py" = ["T20", "FBT", "S603", "PLC0415"]
"src/biff/doctor.py" = ["T20", "FBT", "S603", "PLC0415"]
"src/biff/plugins/claude_code/statusline.py" = ["S602", "T20"]
"src/biff/server/tools/wall.py" = ["FBT"]
"src/biff/mcp_server.py" = ["T20", "FBT"]
"spike/list_changed_server.py" = ["S101", "T20", "PLW0603", "F811"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging.basicConfig".msg = "Configure process logging through punt-observe."
"logging.handlers.RotatingFileHandler".msg = "Use the multiprocess-safe punt-observe sink."
"logging.handlers.TimedRotatingFileHandler".msg = "Use the multiprocess-safe punt-observe sink."

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
skip-checking-short-docstrings = false
allow-init-docstring = true
check-style-mismatch = true

[tool.ruff.lint.isort]
known-first-party = ["biff"]
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests", "tools"]
extraPaths = ["."]

[[tool.pyright.executionEnvironments]]
root = "src/biff/server/tools"
reportUnusedFunction = false

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false

# Layers from docs/package-structure.md (DES-088).  `oo-ratchet layers` gates
# imports against these tables; modules not yet moved into their package
# directory are claimed by exact name.  A layer may import only the layers
# listed in `imports`.
[tool.oo-ratchet.layers.kernel]
prefixes = [
    "_nats_connection",
    "_stdlib",
    "caller_identity",
    "chunking",
    "data",
    "failure_log",
    "logging_config",
    "markers",
    "prob_gate",
    "session_id",
    "session_lock",
    "usage",
    "user_scope",
]
imports = []

[tool.oo-ratchet.layers.wire]
prefixes = ["models", "session_routing", "talk_types", "unread"]
imports = ["kernel"]

[tool.oo-ratchet.layers.engine]
prefixes = [
    "caller_stamp",
    "config",
    "ethos_team",
    "abandoned_canaries",
    "directory_kqueue",
    "identity",
    "invite_expiry",
    "local_watch",
    "nats_relay",
    "relay_errors",
    "relay",
    "relay_config",
    "relay_select",
    "session_handle",
    "session_open",
    "session_registry",
    "talk_latch",
    "talk_state",
    "tty",
    "wtmp_reader",
]
imports = ["kernel", "wire"]

[tool.oo-ratchet.layers.render]
prefixes = ["_formatting", "formatting"]
imports = ["kernel", "wire", "engine"]

[tool.oo-ratchet.layers.commands]
prefixes = ["cli_context", "commands"]
imports = ["kernel", "wire", "engine", "render"]

[tool.oo-ratchet.layers.server]
prefixes = ["server"]
imports = ["kernel", "wire", "engine", "render", "commands"]

# Test helpers: no production layer may import them.
[tool.oo-ratchet.layers.testing]
prefixes = ["testing"]
imports = ["kernel", "wire", "engine", "render", "commands", "server"]

[tool.oo-ratchet.layers.plugins]
prefixes = ["plugins"]
imports = ["kernel", "wire", "engine"]

[tool.oo-ratchet.layers.service]
prefixes = [
    "_enablement_artifacts",
    "ci_workflow",
    "doctor",
    "enablement",
    "git_hooks",
    "integration",
    "relay_check",
    "repo_toggle",
]
imports = ["kernel", "wire", "engine", "render", "plugins"]

[tool.oo-ratchet.layers.claude_code]
prefixes = ["plugins.claude_code"]
imports = ["kernel", "wire", "engine", "render", "commands", "plugins", "service"]

[tool.oo-ratchet.layers.cli]
prefixes = [
    "__main__",
    "_cli_runtime",
    "cli_session",
    "cli_session_drain",
    "cli_session_host",
    "cli_session_lock",
    "cli_session_pointer",
    "cli_session_select",
    "cli_session_store",
    "dispatch",
    "repl_display",
    "repl_notify",
    "repl_readline",
]
imports = [
    "kernel",
    "wire",
    "engine",
    "render",
    "commands",
    "server",
    "plugins",
    "service",
    "claude_code",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q -m 'not slow and not subprocess and not sdk and not cli_multi_user and not nats_local and not nats_docker and not nats_hosted and not stress'"
testpaths = ["tests"]
asyncio_mode = "auto"
# Per-test ceiling so a regression REPORTS (with every thread's stack
# dumped) instead of wedging a developer's session (biff-7xd).  "thread"
# method: a watchdog thread dumps stacks and hard-exits the process on
# expiry, which works even when the hang is inside a blocked asyncio
# await that the default "signal" method's SIGALRM cannot interrupt
# promptly.  120s comfortably covers tier-4 SDK tests (~30s/call) while
# still catching genuine hangs long before a developer has to reach for
# a manual kill.
timeout = 120
timeout_method = "thread"
markers = [
    "slow: marks tests as slow (run with -m slow)",
    "subprocess: marks tests that spawn biff subprocesses (run with -m subprocess)",
    "sdk: marks tests that require Claude Agent SDK and an API key (run with -m sdk)",
    "cli_multi_user: marks CLI multi-user tests over a local nats-server (run with -m cli_multi_user)",
    "nats_local: marks tests that require a locally-spawned nats-server binary (run with -m nats_local)",
    "nats_docker: marks tests that build and run the ghcr.io/punt-labs/biff-relay Docker image (run with -m nats_docker)",
    "nats_hosted: marks tests that require a hosted NATS account (run with -m nats_hosted)",
    "stress: marks scale stress tests against hosted NATS (run with -m stress)",
    "transcript: marks tests that generate demo transcripts (run with -m transcript)",
    "vox: marks tests that manage vox mocking themselves (opts out of _silence_vox)",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 2
