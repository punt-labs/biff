# Baked into the image at build time -- never user-editable. Selected by
# entrypoint.sh instead of base.conf when a nats.conf is bind-mounted at
# /etc/nats/nats.conf (the team and enterprise tiers' auth/TLS layer, per
# docs/self-hosted-relay.md).
#
# The `http` directive is listed *after* the include so it always wins
# regardless of what the mounted nats.conf sets -- the loopback monitor
# bind is a security invariant of this image (see DES-059 in DESIGN.md),
# not something a mounted config should be able to override, intentionally
# or by omission.
#
# The include path is relative ("nats.conf", not "/etc/nats/nats.conf")
# because nats-server resolves `include` relative to the including
# file's own directory even for paths that look absolute -- an absolute
# path here resolves to /etc/nats/etc/nats/nats.conf and fails to parse
# (confirmed by actually running the container, not just reading the
# nats-server docs).
include "nats.conf"
http: "127.0.0.1:8222"
