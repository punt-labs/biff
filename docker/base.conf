# Baked into the image at build time -- never user-editable, never
# bind-mounted over. nats-server's `-m`/`--http_port` CLI flag only takes
# a bare port and always binds to the same host as the client listener
# (`-a`, default 0.0.0.0), so binding the monitoring HTTP endpoint to
# loopback specifically requires a config-file `http` directive; there is
# no equivalent CLI flag. /varz, /connz, and /jsz on that port have no
# auth of their own and would otherwise leak client IPs, subjects, and
# JetStream topology to anything that can reach the container. See
# DES-059 in DESIGN.md.
#
# entrypoint.sh selects this file when no nats.conf is bind-mounted at
# /etc/nats/nats.conf. Layer team/enterprise auth or TLS settings by
# mounting a nats.conf there instead -- entrypoint.sh then selects
# base-with-user.conf, which includes it.
http: "127.0.0.1:8222"
