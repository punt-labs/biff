# Enterprise proof-of-value tier of ghcr.io/punt-labs/biff-relay
# (biff-syr / DES-059). See ../../docs/self-hosted-relay.md's enterprise
# section for the full guide.
#
# Client port only -- monitoring (8222) binds to 127.0.0.1 inside the pod
# and is never exposed through this Service. Swap `type` for
# LoadBalancer, or front this with an Ingress/TLS terminator, matching
# however your org exposes internal services.
apiVersion: v1
kind: Service
metadata:
  name: biff-relay
  labels:
    app: biff-relay
spec:
  type: ClusterIP
  selector:
    app: biff-relay
  ports:
    - name: client
      port: 4222
      targetPort: 4222
