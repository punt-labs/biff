name: Subprocess Tests

# Tier 3a (tests/test_subprocess/): real biff subprocesses over stdio,
# exercising the wire protocol, CLI argument parsing, and process
# lifecycle -- including the SIGTERM/SIGINT/SIGHUP regression tests in
# test_signal_handling.py. Deselected from the default `uv run pytest`
# by pyproject.toml addopts, so it needs its own job to ever run in CI.
# `--relay-url ""` in the fixtures forces the local relay, so the tier
# has no external dependency (no nats-server, no API key) beyond time
# (~75-105s).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  subprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v5
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -m subprocess

  relay-image:
    # Tier 3b (tests/test_relay_image/): builds ghcr.io/punt-labs/biff-relay
    # from THIS checkout's docker/ directory (never a published tag) and
    # runs it as a real container, so this job exercises whatever a PR
    # actually changed in docker/ -- entrypoint.sh's config selection, the
    # loopback monitor bind, and the auth-refusal guard PR #376 added.
    # Neither tier 3c (bare nats-server, no Docker) nor tier 3d (Synadia
    # Cloud) reaches the image itself. `ubuntu-latest` ships Docker
    # preinstalled, so no extra setup step is needed beyond the checkout.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v5
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -m nats_docker
