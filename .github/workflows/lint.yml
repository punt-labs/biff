name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # labeled/unlabeled re-run the ratchets when a reviewer adds or removes
    # the layers-policy-change label.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - run: make lint type
      - name: Ratchets (PR, merge-base compare)
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          LAYERS_POLICY_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'layers-policy-change') }}
        run: |
          git fetch --no-tags origin "${BASE_REF}"
          BASE="$(git merge-base "origin/${BASE_REF}" HEAD)"
          BASE_ARGS="--base-ref ${BASE} --require-base"
          OO_ARGS="${BASE_ARGS}"
          case "${HEAD_REF}" in
            release/*|post-release/*) OO_ARGS="${OO_ARGS} --allow-no-improvement" ;;
          esac
          # A reviewed widening of a layer's imports lands alone, with this label.
          LAYERS_ARGS="${BASE_ARGS}"
          if [ "${LAYERS_POLICY_CHANGE}" = "true" ]; then
            LAYERS_ARGS="${LAYERS_ARGS} --allow-config-change"
          fi
          make check-oo check-coupling check-suppressions check-layers \
            OO_BASE="${OO_ARGS}" COUPLING_BASE="${BASE_ARGS}" \
            SUPPRESSION_BASE="${BASE_ARGS}" LAYERS_BASE="${LAYERS_ARGS}"
      - name: Ratchets (main, post-merge tripwire)
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_ARGS="--base-ref ${BEFORE_SHA} --require-base --tripwire"
          # The merged PR's label is the review record of a layers widening. The
          # PR job already allowed it, so the tripwire must not fail on the same
          # change once it lands.
          LAYERS_ARGS="${BASE_ARGS}"
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[].labels[].name] | join(",")')"
          case ",${labels}," in
            *,layers-policy-change,*) LAYERS_ARGS="${LAYERS_ARGS} --allow-config-change" ;;
          esac
          make check-oo check-coupling check-suppressions check-layers \
            OO_BASE="${BASE_ARGS} --allow-no-improvement" \
            COUPLING_BASE="${BASE_ARGS}" SUPPRESSION_BASE="${BASE_ARGS}" \
            LAYERS_BASE="${LAYERS_ARGS}"

      # Advisory only: retain the verdict or input error even after a gate
      # fails, without letting a reporting failure gate this job.
      - name: Design ratchet (shadow, report only)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          DESIGN_BASE: origin/${{ github.base_ref }}
        run: |
          {
            echo '### Design ratchet (shadow, report only)'
            echo '```text'
            make design-shadow 2>&1 || true
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"
