name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/ tests/
      - run: uv run pyright
      # The shell surface — the plugin's hook dispatchers, the curl|sh
      # installer, and the release scripts — had no lint gate at all, so a
      # broken path in a moved script would only surface at runtime on a
      # user's machine. Mirrors `make lint` so local and CI agree.
      - run: shellcheck plugin/hooks/*.sh install.sh scripts/*.sh
