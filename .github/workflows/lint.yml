name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/ tests/
      - run: uv run pyright
      # The shell surface — the plugin's hook dispatchers, the curl|sh
      # installer, and the release scripts — had no lint gate at all, so a
      # broken path in a moved script would only surface at runtime on a
      # user's machine. Mirrors `make lint` so local and CI agree.
      - run: shellcheck plugin/hooks/*.sh install.sh scripts/*.sh
