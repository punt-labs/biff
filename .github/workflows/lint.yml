name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - run: make lint type
      - name: Ratchets (PR, merge-base compare)
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${BASE_REF}"
          BASE="$(git merge-base "origin/${BASE_REF}" HEAD)"
          BASE_ARGS="--base-ref ${BASE} --require-base"
          OO_ARGS="${BASE_ARGS}"
          case "${HEAD_REF}" in
            release/*|post-release/*) OO_ARGS="${OO_ARGS} --allow-no-improvement" ;;
          esac
          make check-oo check-coupling check-suppressions \
            OO_BASE="${OO_ARGS}" COUPLING_BASE="${BASE_ARGS}" SUPPRESSION_BASE="${BASE_ARGS}"
      - name: Ratchets (main, post-merge tripwire)
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE_ARGS="--base-ref ${BEFORE_SHA} --require-base --tripwire"
          make check-oo check-coupling check-suppressions \
            OO_BASE="${BASE_ARGS} --allow-no-improvement" \
            COUPLING_BASE="${BASE_ARGS}" SUPPRESSION_BASE="${BASE_ARGS}"

      # Advisory only: retain the verdict or input error even after a gate
      # fails, without letting a reporting failure gate this job.
      - name: Design ratchet (shadow, report only)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          DESIGN_BASE: origin/${{ github.base_ref }}
        run: |
          {
            echo '### Design ratchet (shadow, report only)'
            echo '```text'
            make design-shadow 2>&1 || true
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"
