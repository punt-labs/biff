name: Hosted NATS E2E

# Disabled from automatic CI — session-scoped NATS connections hang
# on GitHub Actions (event loop / asyncio interaction).  Run locally:
#   BIFF_TEST_NATS_URL=tls://connect.ngs.global \
#   BIFF_TEST_NATS_CREDS=src/biff/data/demo.creds \
#   uv run pytest -m nats_hosted -v
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev

      - name: Run hosted NATS tests (demo relay)
        run: uv run pytest -m nats_hosted -v
        env:
          BIFF_TEST_NATS_URL: "tls://connect.ngs.global"
          BIFF_TEST_NATS_CREDS: "src/biff/data/demo.creds"
