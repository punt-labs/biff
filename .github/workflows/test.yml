name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/ tests/
      - run: uv run pyright
      - run: make coverage-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
          # A rerun of the same SHA replaces its own artifact.
          overwrite: true

  # Run the installed CLI and MCP round-trip on both supported platforms.
  test-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: make test-wheel

  # Keep the required ruleset context and fail on any non-success dependency.
  test:
    needs: [pytest, test-wheel]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require pytest and the installed-wheel matrix
        env:
          PYTEST_RESULT: ${{ needs.pytest.result }}
          WHEEL_RESULT: ${{ needs.test-wheel.result }}
        run: |
          printf 'pytest: %s\nwheel: %s\n' "$PYTEST_RESULT" "$WHEEL_RESULT"
          [[ "$PYTEST_RESULT" == success && "$WHEEL_RESULT" == success ]]
