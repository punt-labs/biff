name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate tag ref
        run: |
          if [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::Release must be triggered by a v* tag push. For manual dispatch, use: gh workflow run release.yml --ref v1.2.3"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  relay-image-candidate:
    # Build and push the relay image once, under a candidate tag. The release
    # tag is a retag of this exact manifest (the docker job), never a rebuild,
    # so what relay-image-test proves is what ships.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/punt-labs/biff-relay:${{ env.VERSION }}-candidate

  relay-image-test:
    # The relay-image tier (tests/test_relay_image/) against the pushed
    # candidate digest, natively on both shipped architectures.
    needs: relay-image-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      BIFF_RELAY_IMAGE: ghcr.io/punt-labs/biff-relay@${{ needs.relay-image-candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker pull "$BIFF_RELAY_IMAGE"
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -m 'nats_docker and not quarantine' tests/test_relay_image

  docker:
    # Gated on pypi, so a tag can never end up with a Docker image published
    # on GHCR but no matching PyPI release (or vice versa) -- both channels
    # ship together (see CLAUDE.md). Promotes the tested candidate manifest.
    needs: [pypi, relay-image-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the tested candidate as the release
        env:
          DIGEST: ${{ needs.relay-image-candidate.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/punt-labs/biff-relay:${GITHUB_REF_NAME#v}" \
            "ghcr.io/punt-labs/biff-relay@${DIGEST}"

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  test-install:
    needs: testpypi
    runs-on: ubuntu-latest
    # The verifier stops retrying once its 20-minute budget is spent; the rest
    # covers the last in-flight request and the PyPI dependency install.
    timeout-minutes: 30
    steps:
      # The tagged commit, for tools/verify_testpypi.py; nothing is built here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Fetch and verify this run's wheel from TestPyPI
        # Verify before installing: a wheel can carry .pth files that run at
        # every Python start, so nothing from TestPyPI is installed until its
        # bytes match this run's build. skip-existing keeps reruns working;
        # the hash comparison keeps them honest. Standard library only; no
        # package code runs here. Tested in tests/test_verify_testpypi.py.
        run: python tools/verify_testpypi.py punt-biff "${GITHUB_REF_NAME#v}" dist verified
      - name: Smoke-test the verified wheel in a clean environment
        # Installs only the verified wheel plus dependencies from PyPI into a
        # fresh venv, HOME and git repo, then sends and reads a message through
        # the installed CLI and the installed MCP server.
        run: bash scripts/smoke-release.sh candidate "${GITHUB_REF_NAME#v}" verified/*.whl

  pypi:
    needs: [test-install, relay-image-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  published-smoke:
    # TST-8: the exact version from production PyPI, on both shipped OSes.
    needs: pypi
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: bash scripts/smoke-release.sh published "${GITHUB_REF_NAME#v}"

  published-image-smoke:
    # TST-8 for the relay image: pull the release tag from GHCR, confirm it is
    # the tested candidate, and send a message through it.
    needs: [docker, relay-image-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    env:
      CANDIDATE_DIGEST: ${{ needs.relay-image-candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the release tag and match it to the candidate
        run: |
          image="ghcr.io/punt-labs/biff-relay:${GITHUB_REF_NAME#v}"
          docker pull "$image"
          published=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')
          if [[ "$published" != "$CANDIDATE_DIGEST" ]]; then
            echo "::error::$image is $published, not the tested candidate $CANDIDATE_DIGEST"
            exit 1
          fi
          echo "BIFF_RELAY_IMAGE=$image" >> "$GITHUB_ENV"
      - run: uv sync --frozen --extra dev
      # The full tier ran on this digest before promotion; post-release only
      # needs one real operation against the published tag (TST-8, <2 min).
      - run: uv run pytest -m 'nats_docker and not quarantine' tests/test_relay_image -k TestPresenceAndMessaging
