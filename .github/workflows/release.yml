name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate tag ref
        run: |
          if [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::Release must be triggered by a v* tag push. For manual dispatch, use: gh workflow run release.yml --ref v1.2.3"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  docker:
    # Gated on pypi, not just build, so a tag can never end up with a
    # Docker image published on GHCR but no matching PyPI release (or
    # vice versa) -- both channels ship together (see CLAUDE.md).
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/punt-labs/biff-relay:${{ env.VERSION }}

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  test-install:
    needs: testpypi
    runs-on: ubuntu-latest
    # Worst case: 10 metadata polls (30s timeout + 30s wait each), 5 download
    # tries (60s timeout + 30s wait each), then the PyPI dependency install.
    timeout-minutes: 30
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Fetch and verify this run's wheel from TestPyPI
        # Verify before installing: a wheel can carry .pth files that run at
        # every Python start, so nothing from TestPyPI is installed until its
        # bytes match this run's build. skip-existing keeps reruns working;
        # the hash comparison keeps them honest. No package code runs here.
        run: |
          python - "${GITHUB_REF_NAME#v}" <<'EOF'
          import hashlib, json, pathlib, sys, time, urllib.error, urllib.request
          version = sys.argv[1]
          url = f"https://test.pypi.org/pypi/punt-biff/{version}/json"
          built = {d.name: hashlib.sha256(d.read_bytes()).hexdigest()
                   for d in pathlib.Path("dist").iterdir()}
          served = {}
          for attempt in range(1, 11):
              try:
                  with urllib.request.urlopen(url, timeout=30) as resp:
                      served = {f["filename"]: f for f in json.load(resp)["urls"]}
                  if set(built) <= set(served):
                      break
                  print(f"Attempt {attempt}: TestPyPI lists {sorted(served)}; waiting")
              except (urllib.error.URLError, TimeoutError) as err:
                  print(f"Attempt {attempt}: {err}; waiting")
              time.sleep(30)
          else:
              sys.exit(f"::error::TestPyPI never listed {sorted(built)} for {version}")
          for name, digest in built.items():
              if served[name]["digests"]["sha256"] != digest:
                  sys.exit(f"::error::TestPyPI {name} is not this run's build; bump the version")
          wheel = next(n for n in built if n.endswith(".whl"))
          for attempt in range(1, 6):
              try:
                  with urllib.request.urlopen(served[wheel]["url"], timeout=60) as resp:
                      data = resp.read()
                  break
              except (urllib.error.URLError, TimeoutError) as err:
                  print(f"Download attempt {attempt}: {err}; waiting")
                  time.sleep(30)
          else:
              sys.exit(f"::error::could not download {wheel} from TestPyPI")
          if hashlib.sha256(data).hexdigest() != built[wheel]:
              sys.exit(f"::error::downloaded {wheel} does not match this run's build")
          dest = pathlib.Path("verified") / wheel
          dest.parent.mkdir()
          dest.write_bytes(data)
          print(f"Verified {sorted(built)}; downloaded {wheel}")
          EOF
      - name: Install the verified wheel alone
        # --no-deps: nothing but punt-biff may come from TestPyPI, where anyone
        # can publish a higher version of a dependency's name.
        run: uv pip install --system --no-deps verified/*.whl
      - name: Install its dependencies from PyPI only
        # The requirement list comes from the installed package's own metadata,
        # so it never drifts from pyproject.toml.
        run: |
          python -c "import importlib.metadata as m; print('\n'.join(m.requires('punt-biff') or []))" > requirements.txt
          cat requirements.txt
          uv pip install --system --index-url https://pypi.org/simple/ -r requirements.txt
      - name: Verify CLI
        run: biff --help

  pypi:
    needs: test-install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
