[project]
name = "biff-nostr-trial"
version = "0.0.0"
description = "PL-1661 spike: NIP-OA and NIP-17 in Python. Not shipped."
# coincurve 21.0.0 ships no cp314 wheel on any platform, and its sdist fails to
# build on 3.14, so the spike must not resolve to 3.14.
requires-python = ">=3.13,<3.14"
dependencies = [
    "coincurve",
    "cryptography",
    "nostr-sdk",
    "pytest",
]

[project.optional-dependencies]
candidates = ["monstr"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
# Spike tests assert, take literal test vectors, and need no docstrings.
extend-ignore = ["S101", "D", "ANN", "PLR2004", "E501"]

[tool.pytest.ini_options]
testpaths = ["."]
